name: Stack Check

on:
  push:
    branches:
      - agent/fix-directed-route-heuristic

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx biome format lib/core.ts lib/directed-route-hop-heuristic.ts
      - run: bun run typecheck
